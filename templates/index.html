<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Agendamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="client-page">

  <h1 class="client-title">Agende seu horário</h1>

  <div class="client-card">
    <form id="f">

      <!-- NOME -->
      <input
        id="nome"
        placeholder="Seu nome"
        required
      >

      <!-- SERVIÇO -->
      <select id="servico" required>
        <option value="" disabled selected>Escolha o serviço</option>
        {% for s in servicos %}
          <option>{{ s }}</option>
        {% endfor %}
      </select>

      <!-- DATA -->
      <input
        id="data"
        type="date"
        required
      >

      <!-- HORÁRIO -->
      <select id="horario" required>
        <option value="" disabled selected>Escolha o horário</option>
      </select>

      <!-- BOTÃO -->
      <button type="submit" class="client-btn">
        Confirmar agendamento
      </button>

    </form>
  </div>

<script>
/* ==========================
   CLIENTE – HORÁRIOS
   ========================== */

const data = document.getElementById("data");
const horario = document.getElementById("horario");

data.onchange = async () => {
  horario.innerHTML = '<option>Carregando horários...</option>';

  const r = await fetch(`/horarios?data=${data.value}`);
  const j = await r.json();

  horario.innerHTML = '<option value="" disabled selected>Escolha o horário</option>';

  j.horarios.forEach(h => {
    const o = document.createElement("option");
    o.text = h;
    horario.add(o);
  });
};

/* ==========================
   CLIENTE – SUBMIT
   ========================== */

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();

  const r = await fetch("/agendamentos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nome: nome.value,
      data: data.value,
      horario: horario.value,
      servico: servico.value
    })
  });

  const j = await r.json();
  location.href = j.whatsapp_url;
};
</script>

</body>
</html>

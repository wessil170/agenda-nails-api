<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Nail Designer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h2>Agende seu horário</h2>

    <form id="form">

        <input id="nome" placeholder="Nome" required>

        <input type="date" id="data" required>

        <select id="horario" required>
            <option value="">Selecione a data</option>
        </select>

        <select id="servico" required>
            <option value="">Selecione o serviço</option>
        </select>

        <button type="submit">Agendar pelo WhatsApp</button>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const data = document.getElementById("data");
    const horario = document.getElementById("horario");
    const servico = document.getElementById("servico");
    const form = document.getElementById("form");

    // carregar serviços
    fetch("/servicos")
        .then(r => r.json())
        .then(lista => {
            lista.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                servico.appendChild(opt);
            });
        });

    // carregar horários
    data.addEventListener("change", async () => {
        horario.innerHTML = "<option>Carregando...</option>";
        const res = await fetch(`/horarios?data=${data.value}`);
        const lista = await res.json();
        horario.innerHTML = "";

        if (lista.length === 0) {
            horario.innerHTML = "<option>Nenhum horário disponível</option>";
            return;
        }

        lista.forEach(h => {
            const opt = document.createElement("option");
            opt.value = h;
            opt.textContent = h;
            horario.appendChild(opt);
        });
    });

    // submit
    form.addEventListener("submit", async e => {
        e.preventDefault();

        const payload = {
            nome: document.getElementById("nome").value,
            data: data.value,
            horario: horario.value,
            servico: servico.value
        };

        const res = await fetch("/agendamentos", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const json = await res.json();
        window.location.href = json.whatsapp_url;
    });
});
</script>

</body>
</html>

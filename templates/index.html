<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agendamento - Nail Designer</title>
</head>
<body>

<h2>Agende seu horário</h2>

<form id="form-agendamento">
    <label>Nome:</label><br>
    <input type="text" id="nome" required><br><br>

    <label>Data:</label><br>
    <input type="date" id="data" required><br><br>

    <label>Horário:</label><br>
    <select id="horario" required>
        <option value="">Selecione uma data</option>
    </select><br><br>

    <label>Serviço:</label><br>
    <input type="text" id="servico" required><br><br>

    <button type="submit">Agendar pelo WhatsApp</button>
</form>

<script>
const dataInput = document.getElementById("data");
const horarioSelect = document.getElementById("horario");

dataInput.addEventListener("change", async () => {
    const data = dataInput.value;
    horarioSelect.innerHTML = "<option>Carregando...</option>";

    const res = await fetch(`/horarios?data=${data}`);
    const json = await res.json();

    horarioSelect.innerHTML = "";

    if (json.horarios.length === 0) {
        horarioSelect.innerHTML = "<option>Nenhum horário disponível</option>";
        return;
    }

    json.horarios.forEach(h => {
        const option = document.createElement("option");
        option.value = h;
        option.textContent = h;
        horarioSelect.appendChild(option);
    });
});

document.getElementById("form-agendamento").addEventListener("submit", async e => {
    e.preventDefault();

    const payload = {
        nome: nome.value,
        data: data.value,
        horario: horario.value,
        servico: servico.value
    };

    const res = await fetch("/agendamentos", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const json = await res.json();
    window.location.href = json.whatsapp_url;
});
</script>

</body>
</html>

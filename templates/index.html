<script>
const dataInput = document.getElementById("data");
const horarioSelect = document.getElementById("horario");

// Quando a data mudar, carrega os horários
dataInput.addEventListener("change", async () => {
    const dataSelecionada = dataInput.value;

    if (!dataSelecionada) return;

    horarioSelect.innerHTML = "<option>Carregando...</option>";

    try {
        const res = await fetch(`/horarios?data=${dataSelecionada}`);
        const horarios = await res.json();

        horarioSelect.innerHTML = "";

        if (horarios.length === 0) {
            horarioSelect.innerHTML = "<option>Nenhum horário disponível</option>";
            return;
        }

        horarios.forEach(h => {
            const option = document.createElement("option");
            option.value = h;
            option.textContent = h;
            horarioSelect.appendChild(option);
        });

    } catch (err) {
        horarioSelect.innerHTML = "<option>Erro ao carregar horários</option>";
        console.error(err);
    }
});

// Envio do formulário
document.getElementById("form-agendamento").addEventListener("submit", async function(e) {
    e.preventDefault();

    const payload = {
        nome: document.getElementById("nome").value,
        data: document.getElementById("data").value,
        horario: document.getElementById("horario").value,
        servico: document.getElementById("servico").value
    };

    const res = await fetch("/agendamentos", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const resposta = await res.json();

    if (resposta.whatsapp_url) {
        window.location.href = resposta.whatsapp_url;
    } else {
        alert("Erro ao criar agendamento");
    }
});
</script>
